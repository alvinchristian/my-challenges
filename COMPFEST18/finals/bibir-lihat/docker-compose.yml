version: "3.9"

services:
  chall:
    build:
      context: .
      dockerfile: Dockerfile.challenge

    restart: unless-stopped

    ports:
      - "5000:5000"

    privileged: true

    environment:
      JAIL_TIME: "60"
      JAIL_MEM: "64M"
      JAIL_PIDS: "16"
      JAIL_CPU: "100"

    mem_limit: 256m
    cpus: 0.25